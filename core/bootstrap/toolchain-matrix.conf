[DEFAULT_NEWER]
FAMILY=
MACOS_NAME=Unrecognized (newer than this matrix)
PATCH_FLOOR=
APPLE_XCODE_MIN=
APPLE_XCODE_MAX=
CAPABILITY_PROFILE=standard_clt
ARCH_CONSTRAINT=any
BREW_TIER=verify_live
TOOLKIT_STRATEGY=proceed_with_caution

[DEFAULT_OLDER]
FAMILY=
MACOS_NAME=Unrecognized (older than this matrix's floor)
PATCH_FLOOR=
APPLE_XCODE_MIN=
APPLE_XCODE_MAX=
CAPABILITY_PROFILE=standard_clt
ARCH_CONSTRAINT=any
BREW_TIER=unsupported
TOOLKIT_STRATEGY=stop
