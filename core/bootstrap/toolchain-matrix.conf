# core/bootstrap/toolchain-matrix.conf — the single authoritative source
# for macOS/Xcode/Command Line Tools/Homebrew compatibility. One [floor]
# section per (macOS family, patch band); same awk-parseable flat KEY=value
# convention as catalog/presets.conf — no YAML/JSON, no new dependency.
#
# A macOS major version can have more than one section only when Apple's
# own Xcode compatibility genuinely splits mid-version (see Sonoma below).
# Lookup: within the detected major-version FAMILY, the row with the
# greatest PATCH_FLOOR that is <= the detected full macOS version wins.
# See core/bootstrap/toolchain.sh for the lookup implementation.
#
# Fields:
#   FAMILY              macOS major version this row belongs to
#   MACOS_NAME          human label, display only, never branched on
#   PATCH_FLOOR         minimum patch (within FAMILY) this row applies from
#   APPLE_XCODE_MIN/MAX Apple's documented Xcode compatibility window for
#                       this patch band — context only, never an install
#                       target (xcode-select --install always installs
#                       whatever Apple currently offers for the running OS)
#   CAPABILITY_PROFILE  the named, behaviorally-validated toolchain
#                       capability this row requires (see toolchain.sh)
#   ARCH_CONSTRAINT     any | apple_silicon_only | intel_only
#   BREW_TIER           Homebrew's own published support-tier label for
#                       this row — informational/logging only; Homebrew's
#                       actual compatibility is always validated live,
#                       never gated on this label or on a pinned version
#   TOOLKIT_STRATEGY    proceed | proceed_with_warning | proceed_with_caution
#                       | stop — see toolchain.sh for exact behavior

[12.5]
FAMILY=12
MACOS_NAME=Monterey
PATCH_FLOOR=12.5
APPLE_XCODE_MIN=14.0
APPLE_XCODE_MAX=14.2
CAPABILITY_PROFILE=standard_clt
ARCH_CONSTRAINT=any
BREW_TIER=tier3
TOOLKIT_STRATEGY=proceed_with_warning

[13.5]
FAMILY=13
MACOS_NAME=Ventura
PATCH_FLOOR=13.5
APPLE_XCODE_MIN=14.3
APPLE_XCODE_MAX=15.2
CAPABILITY_PROFILE=standard_clt
ARCH_CONSTRAINT=any
BREW_TIER=tier3
TOOLKIT_STRATEGY=proceed_with_warning

[14.0]
FAMILY=14
MACOS_NAME=Sonoma
PATCH_FLOOR=14.0
APPLE_XCODE_MIN=15.3
APPLE_XCODE_MAX=15.4
CAPABILITY_PROFILE=standard_clt
ARCH_CONSTRAINT=any
BREW_TIER=tier2
TOOLKIT_STRATEGY=proceed

[14.5]
FAMILY=14
MACOS_NAME=Sonoma
PATCH_FLOOR=14.5
APPLE_XCODE_MIN=16.0
APPLE_XCODE_MAX=
CAPABILITY_PROFILE=standard_clt
