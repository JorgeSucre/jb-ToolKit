# catalog/presets.conf — the single authoritative source for every preset.
# One [id] section per preset, flat KEY=value inside — same awk-parseable
# convention as app.conf. See docs/Catalog-Format.md and
# docs/architecture/0007-catalog-consistency.md for the format contract and
# why this replaced one file per preset.
#
# A preset is nothing more than NAME/DESCRIPTION/ORDER/APPS. No logic, no
# execution rules, no conditions, no categories, no nested references to
# other presets — see docs/architecture/0006-deployment-flattening.md.

